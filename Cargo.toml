[package]
name = "cockpit_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "cockpit_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher", "functions"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
uuid = { version = "=1.8.0", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "=1.7.0"
getrandom = "=0.2.15"
base64ct = "=1.6.0"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
calamine = "0.24"
csv = "1"
encoding_rs = "0.8"

[profile.dev]
opt-level = 0
